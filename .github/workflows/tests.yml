name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU-only PyTorch wheel: the default PyPI wheel pulls several GB of CUDA libraries.
      # ninja lets the native C++ tests build instead of skipping.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[native,laboratory]"

      - name: Quick svdlab check of the starter SVD
        run: python -m svdlab check examples/my_svd.py --quick

      - name: Test suite (CPU)
        run: python -m unittest discover -s tests -v
